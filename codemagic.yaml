workflows:
  reports-ui:
    name: Reports UI Deployment

    environment:
      node: 21
      npm: 10
      groups:
        - aws_credentials
        - build_variables

    scripts:
      - name: Install Dependencies
        script: |
          npm i

      - name: Build Web App
        script: |
          # Suffix appended to the runtime tenant for the config-fetch API only.
          # Tenant-agnostic: prod config buckets are "<tenant>-prod",
          # staging (DEMO) is "<tenant>-stg", UAT is "<tenant>".
          case "$ENVIRONMENT" in
            "UAT")
              export VITE_CONFIG_TENANT_SUFFIX=""
              ;;
            "DEMO")
              export VITE_CONFIG_TENANT_SUFFIX="-stg"
              ;;
            "PROD")
              export VITE_CONFIG_TENANT_SUFFIX="-prod"
              ;;
            *)
              echo "Unknown environment: $ENVIRONMENT"
              exit 1
          esac

          echo "Building app for ENVIRONMENT=$ENVIRONMENT (config tenant suffix: '${VITE_CONFIG_TENANT_SUFFIX}')"
          npm run build:app

      - name: Upload Build to S3
        script: |
          BUCKET=""

          case "$ENVIRONMENT" in
            "UAT")
              BUCKET="reportsuiuat"
              ;;
            "DEMO")
              BUCKET="reportsuidemo"
              ;;
            "PROD")
              BUCKET="reportsuipackage"
              ;;
            *)
              echo "Unknown environment: $ENVIRONMENT"
              exit 1
          esac

          # Hashed build assets (dist-app/assets/*) never change content under
          # the same name, so browsers may cache them forever.
          aws s3 sync dist-app/assets/ s3://${BUCKET}/assets/ \
            --cache-control "public, max-age=31536000, immutable"

          # index.html and any other unhashed files must always revalidate.
          # Without this, browsers heuristically cache index.html — and since
          # Chrome partitions cache by top-level site, the copy embedded in the
          # parent portal iframe stays stale even after CloudFront invalidation.
          aws s3 sync dist-app/ s3://${BUCKET}/ --exclude "assets/*" \
            --cache-control "no-cache, must-revalidate"

          # Force metadata refresh on index.html even if its content is unchanged
          # (s3 sync skips unchanged files, which would keep old headers).
          aws s3 cp dist-app/index.html s3://${BUCKET}/index.html \
            --cache-control "no-cache, must-revalidate" \
            --content-type "text/html; charset=utf-8" \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront Cache
        script: |
          DISTRIBUTION_ID=""

          case "$ENVIRONMENT" in
            "UAT")
              DISTRIBUTION_ID="$UAT_DISTRIBUTION_ID"
              ;;
            "DEMO")
              DISTRIBUTION_ID="$DEMO_DISTRIBUTION_ID"
              ;;
            "PROD")
              DISTRIBUTION_ID="$PROD_DISTRIBUTION_ID"
              ;;
            *)
              echo "Unknown environment: $ENVIRONMENT"
              exit 1
          esac

          echo "Invalidating CloudFront distribution: $DISTRIBUTION_ID"

          aws cloudfront create-invalidation \
            --distribution-id ${DISTRIBUTION_ID} \
            --paths "/*"

          echo "CloudFront cache invalidation initiated"