workflows:
  reports-ui:
    name: Reports UI Deployment

    environment:
      node: 21
      npm: 10
      groups:
        - aws_credentials
        - build_variables

    scripts:
      - name: Install Dependencies
        script: |
          npm i

      - name: Build Web App
        script: |
          # Suffix appended to the runtime tenant for the config-fetch API only.
          # Tenant-agnostic: prod config buckets are "<tenant>-prod",
          # staging (DEMO) is "<tenant>-stg", UAT is "<tenant>".
          case "$ENVIRONMENT" in
            "UAT")
              export VITE_CONFIG_TENANT_SUFFIX=""
              ;;
            "DEMO")
              export VITE_CONFIG_TENANT_SUFFIX="-stg"
              ;;
            "PROD")
              export VITE_CONFIG_TENANT_SUFFIX="-prod"
              ;;
            *)
              echo "Unknown environment: $ENVIRONMENT"
              exit 1
          esac

          echo "Building app for ENVIRONMENT=$ENVIRONMENT (config tenant suffix: '${VITE_CONFIG_TENANT_SUFFIX}')"
          npm run build:app

      - name: Upload Build to S3
        script: |
          BUCKET=""

          case "$ENVIRONMENT" in
            "UAT")
              BUCKET="reportsuiuat"
              ;;
            "DEMO")
              BUCKET="reportsuidemo"
              ;;
            "PROD")
              BUCKET="reportsuipackage"
              ;;
            *)
              echo "Unknown environment: $ENVIRONMENT"
              exit 1
          esac

          aws s3 sync dist-app/ s3://${BUCKET}/